# Build Fenix 156.0 Release APK (Lint & Nicolewei edition) — artifact GeckoView
#
# Based on the FIREFOX-ANDROID_156_0_RELEASE tag from mozilla-firefox/firefox,
# using the same LintCat build kit proven on the nightly build.
#
# Pinned prebuilts:
#   GeckoView(omni): org.mozilla.geckoview:geckoview-omni:156.0.20260909172920
#   Android Components: org.mozilla.components:*:156.0
name: Build Fenix 156.0 Release APK (Lint & Nicolewei)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MOZ_BUILD_DATE: "20260909172920"
      ORG_GRADLE_PROJECT_nightlyVersion: "156.0"
      ORG_GRADLE_PROJECT_versionName: "1.0.0.lint&nicolewei.2026.9.18.build"
    steps:
      - name: Checkout Firefox 156.0 Release source (upstream tag)
        uses: actions/checkout@v4
        with:
          repository: mozilla-firefox/firefox
          ref: FIREFOX-ANDROID_156_0_RELEASE
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(ls -d $SDK/cmdline-tools/* 2>/dev/null | tail -1)
          echo "$CMDLINE/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK layout:"; ls "$SDK"
          echo "cmdline-tools:"; ls "$SDK/cmdline-tools" || true
          touch "$SDK/.wtest" 2>/dev/null && echo "SDK writable" || { echo "SDK not writable; fixing with sudo..."; sudo chown -R "$(id -u):$(id -g)" "$SDK"; }
          rm -f "$SDK/.wtest" || true

      - name: Accept licenses and install SDK basics
        run: |
          CMDLINE=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/* 2>/dev/null | tail -1)
          yes | "$CMDLINE/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo '--- install packages ---'
          "$CMDLINE/bin/sdkmanager" "platform-tools" "platforms;android-36" "platforms;android-37" "emulator" "cmdline-tools;21.0" || true
          if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/21.0/bin/sdkmanager" ]; then
            echo '--- fallback: direct download cmdline-tools 21.0 ---'
            cd /tmp
            curl -sL -o clt.zip 'https://dl.google.com/android/repository/commandlinetools-linux-15641748_latest.zip' || true
            unzip -q -o clt.zip -d clt_extract || true
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/21.0"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            mv clt_extract/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/21.0" 2>/dev/null || true
          fi
          echo '--- after ---'
          ls "$ANDROID_SDK_ROOT/cmdline-tools" || true
          test -f "$ANDROID_SDK_ROOT/cmdline-tools/21.0/bin/sdkmanager" && echo 'cmdline-tools 21.0 OK' || echo 'cmdline-tools 21.0 STILL MISSING'
          CLT="$ANDROID_SDK_ROOT/cmdline-tools/21.0/bin/sdkmanager"
          if [ -f "$CLT" ]; then
            yes | "$CLT" --licenses > /dev/null 2>&1 || true
            "$CLT" "platform-tools" "platforms;android-36" "platforms;android-37" "emulator" || true
          fi
          mkdir -p "$HOME/.mozbuild"
          ln -sfn "$ANDROID_SDK_ROOT" "$HOME/.mozbuild/android-sdk-linux"
          echo 'mozbuild symlink:'
          ls -la "$HOME/.mozbuild/" | head || true

      - name: Fetch LintCat build helper
        run: |
          mkdir -p .lintcat
          curl -fsSL https://raw.githubusercontent.com/LintCat/firefox/main/.lintcat/gen_crash_report.py -o .lintcat/gen_crash_report.py
          wc -l .lintcat/gen_crash_report.py
          head -5 .lintcat/gen_crash_report.py

      - name: Patch version logic & settings (no SNAPSHOT; use Maven GeckoView)
        run: |
          F1=build.gradle
          F2=mobile/android/android-components/components/browser/engine-gecko/build.gradle
          sed -i 's|version += "-SNAPSHOT"|// LintCat pin: no SNAPSHOT|g' "$F1" "$F2"
          sed -i "s|include ':geckoview'|// LintCat: disable local geckoview|; s|project(':geckoview').projectDir|// LintCat: disable local geckoview projectDir|g" settings.gradle
          echo '--- patched lines ---'
          grep -n 'SNAPSHOT\|LintCat' "$F1" "$F2" settings.gradle || true

      - name: Write mozconfig (release artifact build)
        run: |
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          cat > mozconfig <<EOF
          export MOZ_UPDATE_CHANNEL=release
          ac_add_options --enable-application=mobile/android
          ac_add_options --enable-artifact-builds
          ac_add_options --enable-update-channel=release
          ac_add_options --enable-android-subproject=fenix
          ac_add_options --target=aarch64-linux-android
          ac_add_options --with-android-sdk=$SDK
          EOF
          echo '--- mozconfig ---'
          cat mozconfig

      - name: Configure (mach)
        run: ./mach configure

      - name: Prepare signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -la "$RUNNER_TEMP/release.jks"

      - name: Prepare build metadata (buildid.h for gradle)
        run: |
          OBJ=obj-aarch64-unknown-linux-android
          mkdir -p "$OBJ"
          echo "#define MOZ_BUILDID $MOZ_BUILD_DATE" > "$OBJ/buildid.h"
          cat "$OBJ/buildid.h"

      - name: Generate CrashReport annotation sources (pre-export equivalent)
        run: |
          export OBJ="$PWD/obj-aarch64-unknown-linux-android"
          ./mach python .lintcat/gen_crash_report.py
          ls -la "$OBJ/mobile/android/android-components/components/lib/crash/src/main/java/mozilla/components/lib/crash/service/" || true
          head -8 "$OBJ/mobile/android/android-components/components/lib/crash/src/main/java/mozilla/components/lib/crash/service/CrashReport.kt" || true

      - name: Build Fenix 156 release (Maven GeckoView, no Gecko compile)
        run: |
          export ORG_GRADLE_PROJECT_disableDebugSigning=true
          ./mach gradle fenix:assembleRelease

      - name: Locate APK
        run: |
          OBJ=obj-aarch64-unknown-linux-android
          echo '--- search in objdir ---'
          find "$OBJ/gradle/build/mobile/android/fenix" -name "*.apk" 2>/dev/null | head -40 || true
          echo '--- search in source tree ---'
          find mobile/android/fenix/app/build -name "*.apk" 2>/dev/null | head -40 || true

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          OBJ=obj-aarch64-unknown-linux-android
          APKS=$(find "$OBJ/gradle/build/mobile/android/fenix" -name "*.apk" 2>/dev/null | grep -i release | sort)
          if [ -z "$APKS" ]; then
            APKS=$(find "$OBJ" -name "*.apk" 2>/dev/null | sort)
          fi
          echo 'APKs found:'
          echo "$APKS"
          if [ -z "$APKS" ]; then
            echo 'ERROR: no APK found to sign'
            exit 1
          fi
          while IFS= read -r APK; do
            [ -z "$APK" ] && continue
            BASE=$(basename "$APK" .apk)
            echo "Signing: $APK"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/$BASE-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --out "$RUNNER_TEMP/$BASE-signed.apk" \
              "$RUNNER_TEMP/$BASE-aligned.apk"
          done <<< "$APKS"
          ls -la "$RUNNER_TEMP"/*-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: fenix156-lint-nicolewei-signed-apks
          path: ${{ runner.temp }}/*-signed.apk
          if-no-files-found: error