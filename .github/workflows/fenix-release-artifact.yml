# Build Fenix Release APK (artifact GeckoView) — custom Momo build
#
# Uses Mozilla's PREBUILT GeckoView (no Gecko compilation).
# Pinned to the nightly build 2026-09-17 10:03:02 UTC:
#   - GeckoView:        https://maven.mozilla.org/maven2/org/mozilla/geckoview/
#   - Android Components: https://nightly.maven.mozilla.org/maven2/org/mozilla/components/
name: Build Fenix Release APK (artifact GeckoView)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Pin versions to a published build so GeckoView/AC resolve from Maven
      MOZ_BUILD_DATE: "20260917100302"
      MOZ_ANDROID_FAT_AAR_ARCHITECTURES: "arm64-v8a"
      ORG_GRADLE_PROJECT_nightlyVersion: "158.0.20260917100302"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (preinstalled on runner)
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(ls -d $SDK/cmdline-tools/* 2>/dev/null | tail -1)
          echo "$CMDLINE/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK layout:"; ls "$SDK"
          echo "cmdline-tools:"; ls "$SDK/cmdline-tools" || true
          touch "$SDK/.wtest" 2>/dev/null && echo "SDK writable" || { echo "SDK not writable; fixing with sudo..."; sudo chown -R "$(id -u):$(id -g)" "$SDK"; }
          rm -f "$SDK/.wtest" || true

      - name: Accept licenses and install SDK basics
        run: |
          CMDLINE=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/* 2>/dev/null | tail -1)
          yes | "$CMDLINE/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo '--- install packages ---'
          "$CMDLINE/bin/sdkmanager" "platform-tools" "platforms;android-37" "cmdline-tools;21.0" || true
          if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/21.0/bin/sdkmanager" ]; then
            echo '--- fallback: direct download cmdline-tools 21.0 (build 15641748) ---'
            cd /tmp
            curl -sL -o clt.zip 'https://dl.google.com/android/repository/commandlinetools-linux-15641748_latest.zip' || true
            unzip -q -o clt.zip -d clt_extract || true
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/21.0"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            mv clt_extract/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/21.0" 2>/dev/null || true
          fi
          echo '--- after ---'
          ls "$ANDROID_SDK_ROOT/cmdline-tools" || true
          test -f "$ANDROID_SDK_ROOT/cmdline-tools/21.0/bin/sdkmanager" && echo 'cmdline-tools 21.0 OK' || echo 'cmdline-tools 21.0 STILL MISSING'
          CLT="$ANDROID_SDK_ROOT/cmdline-tools/21.0/bin/sdkmanager"
          if [ -f "$CLT" ]; then
            yes | "$CLT" --licenses > /dev/null 2>&1 || true
            "$CLT" "platform-tools" "platforms;android-37" "build-tools;37.0.0" || true
          fi
          mkdir -p "$HOME/.mozbuild"
          ln -sfn "$ANDROID_SDK_ROOT" "$HOME/.mozbuild/android-sdk-linux"
          echo 'mozbuild symlink:'
          ls -la "$HOME/.mozbuild/" | head || true

      - name: Write mozconfig (artifact build)
        run: |
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          cat > mozconfig <<EOF
          export MOZ_UPDATE_CHANNEL=nightly
          ac_add_options --enable-application=mobile/android
          ac_add_options --enable-artifact-builds
          ac_add_options --enable-android-subproject=fenix
          ac_add_options --target=aarch64-linux-android
          ac_add_options --with-android-sdk=$SDK
          EOF
          echo '--- mozconfig ---'
          cat mozconfig

      - name: Configure (mach)
        run: ./mach configure

      - name: Prepare signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -la "$RUNNER_TEMP/release.jks"

      - name: Build Fenix release (Maven GeckoView, no Gecko compile)
        run: |
          export ORG_GRADLE_PROJECT_disableDebugSigning=true
          ./mach gradle fenix:app:assembleRelease

      - name: Locate APK
        run: |
          find mobile/android/fenix/app/build -name "*.apk" 2>/dev/null | head -40 || true

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          APK=$(find mobile/android/fenix/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Signing: $APK"
          echo "Build tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out "$RUNNER_TEMP/fenix-momo-release-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/fenix-momo-release-signed.apk" | head -30

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: fenix-momo-release-signed-apk
          path: ${{ runner.temp }}/fenix-momo-release-signed.apk
          if-no-files-found: error
